# Originally generated by nwg-displays on 2026-09-08 at 18:33:12.
# Edited by hand 2026-09-16: eDP-1 carried a hardcoded 2560x167 position,
# which nwg-displays wrote while an external monitor sat to its left. With
# HDMI-A-1 unplugged that offset stayed, leaving 2560px of dead space the
# cursor could not cross, so the pointer never reached the screen's left edge.
#
# auto-right places eDP-1 relative to whatever else exists: alone it lands at
# 0x0, docked it sits right of HDMI-A-1. Re-running nwg-displays will
# overwrite this file with hardcoded coordinates again.

monitor=eDP-1,1920x1080@144.0,auto-right,1.0,vrr,1
monitor=HDMI-A-1,2560x1440@144.0,0x0,1,vrr,1

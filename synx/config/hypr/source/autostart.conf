#  Caelestia shell is the bar, launcher, notifications, OSD and lock screen.
#  It runs as a systemd unit so a crash respawns it instead of hanging.
exec-once = uwsm-app -- systemctl --user start caelestia-shell.service

#  swayosd-server backs the on-screen volume popup and the volume keybinds
#  below. Without it, mouse/keyboard volume keys fire but change nothing.
exec-once = uwsm-app -- swayosd-server

#  nwg-displays pins absolute monitor positions, so undocking strands
#  eDP-1 behind an empty gap. This moves it back to the origin.
exec-once = uwsm-app -- ~/user_scripts/hypr/monitor_reflow.py

#  Clipboard history, feeding the rofi cliphist keybind ported from dusk.
exec-once = uwsm-app -- wl-paste --type text --watch cliphist store
exec-once = uwsm-app -- sh -c 'wl-paste --type image --watch cliphist store 2>/dev/null'
exec-once = uwsm-app -- wl-clip-persist --clipboard regular

#  Polkit agent and environment propagation.
exec-once = uwsm-app -- systemctl --user start hyprpolkitagent
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

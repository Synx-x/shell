# NVIDIA dGPU (card0, PCI 01:00.0) as primary renderer, Intel iGPU (card1) secondary.
# Fixes aquamarine cursor-blit EGL failures (glCheckFramebufferStatus 1282) that recur
# when this is unset and aquamarine picks the iGPU as primary. Requires a full
# Hyprland restart (not just `hyprctl reload`) to take effect.
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
env = XDG_CURRENT_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = CAELESTIA_WALLPAPERS_DIR,/home/pc/Pictures/wallpapers

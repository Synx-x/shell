#  Caelestia keybinds, ported from dusk
#
#  Four buckets:
#    1. Verbatim from dusk, pure Hyprland dispatchers.
#    2. Verbatim from dusk, backed by ~/user_scripts (symlinked to dusk).
#    3. Remapped to caelestia IPC, where caelestia replaces a dusk component.
#    4. Dropped, listed at the bottom, no equivalent exists.
#
#  Caelestia IPC verbs were read from the installed QML at
#  /etc/xdg/quickshell/caelestia/. Drawer names come from Shortcuts.qml.

$scripts     = $HOME/user_scripts
$mainMod     = SUPER
$ws_script   = ~/user_scripts/hypr/multi_monitor_workspace.sh
$terminal    = kitty
$cae         = caelestia shell

##  Launchers and menus  ######################################################

# Caelestia launcher replaces rofi drun. Same key as dusk.
bindd = ALT, SPACE, Launch Menu for Apps, exec, $cae drawers toggle launcher
bindd = $mainMod, SPACE, Dashboard, exec, $cae drawers toggle dashboard
bindd = ALT SHIFT, SPACE, Session Menu, exec, $cae drawers toggle session
bindd = $mainMod ALT, SPACE, Utilities, exec, $cae drawers toggle utilities
bindd = $mainMod SHIFT, BACKSLASH, Sidebar, exec, $cae drawers toggle sidebar

# Rofi menus kept from dusk, these have no caelestia equivalent.
bindd = CTRL SHIFT, SPACE, Show Keybinds, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/keybindings.sh
bindd = $mainMod CTRL, SPACE, Search Emojis, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/emoji.sh
bindd = $mainMod CTRL SHIFT, SPACE, Calculator, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/calculator.sh
bindd = $mainMod SHIFT, SPACE, Matugen Theme Config, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/rofi_theme.sh
bindd = CTRL, SPACE, Rofi Wallpaper Selector, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/rofi_wallpaper_selctor.sh
bindd = CTRL ALT, SPACE, UWSM uuctl, exec, uwsm-app -- pkill rofi; uuctl
bindd = $mainMod ALT, A, Hyprland Animation Menu, exec, uwsm-app -- pkill rofi; rofi -show animations -modi "animations:~/user_scripts/rofi/hypr_anim.sh"
bindd = $mainMod ALT, S, Shader Menu, exec, uwsm-app -- pkill rofi; ~/user_scripts/rofi/shader_menu.sh

##  Terminal and apps  ########################################################

bindd = $mainMod, Return, Terminal, exec, uwsm-app -- $terminal
bindd = $mainMod, Q, Terminal, exec, uwsm-app -- $terminal
bindd = CTRL SHIFT, escape, System Monitor, exec, uwsm-app -- $terminal --class dgop -e dgop
bindd = ALT, 1, Wi-Fi Manager, exec, uwsm-app -- $terminal --class wifitui -e wifitui
bindd = ALT, 2, Bluetooth Manager, exec, uwsm-app -- blueman-manager
bindd = ALT, 3, Audio Mixer, exec, uwsm-app -- pavucontrol
bindd = ALT, 5, Unlock Browser, exec, uwsm-app -- $terminal -e ~/user_scripts/drives/drive_manager.sh unlock browser
bindld = ALT SHIFT, 5, Lock Browser, exec, uwsm-app -- $terminal -e ~/user_scripts/drives/drive_manager.sh lock browser
bindd = , XF86Calculator, Calculator, exec, uwsm-app -- gnome-calculator
bindd = , XF86Launch3, ASUS Control, exec, uwsm-app -- $terminal --class asusctl.sh -e sudo ~/user_scripts/asus/asusctl.sh

##  Wallpaper  ################################################################

# Caelestia owns wallpaper. Dusk's matugen cycling scripts are kept as-is
# because they also drive the colour scheme.
bindd = $mainMod, apostrophe, Cycle Next Wallpaper, exec, uwsm-app -- ~/user_scripts/theme_matugen/theme_ctl.sh next
bindd = $mainMod, semicolon, Cycle Prev Wallpaper, exec, uwsm-app -- ~/user_scripts/theme_matugen/theme_ctl.sh prev
bindd = $mainMod SHIFT, apostrophe, Cycle Fav Wallpaper, exec, uwsm-app -- ~/user_scripts/rofi/rofi_wallpaper_selctor.sh --next-fav
bindd = ALT, 4, Random Wallpaper (caelestia), exec, $cae wallpaper setRandom

##  Game mode, display, session  ##############################################

bindld = ALT, 6, Disable Game Mode, exec, notify-send -u critical -t 3000 "Passthrough Enabled" "Press ALT+6 to exit"; hyprctl dispatch submap passthrough
bindld = ALT, 6, Game Mode, exec, notify-send -u low -t 2000 "Passthrough Disabled" "Keybinds restored"; hyprctl dispatch submap reset
bindld = CTRL ALT, R, Rotate Screen Clockwise, exec, uwsm-app -- ~/user_scripts/hypr/screen_rotate.sh -90
bindld = CTRL ALT SHIFT, R, Rotate Screen Anti-Clockwise, exec, uwsm-app -- ~/user_scripts/hypr/screen_rotate.sh +90
bindld = ALT, F7, Screen Off DPMS, exec, sleep 1 && hyprctl dispatch dpms off
bindld = ALT, F8, Screen On DPMS, exec, hyprctl dispatch dpms on
bindld = ALT, R, Reload Hyprland, exec, hyprctl reload
bindd = ALT, F4, Logout Menu, exec, $cae drawers toggle session
bindd = $mainMod, M, Lock Screen, exec, $cae lock lock

##  Visual toggles  ###########################################################

bindld = $mainMod ALT, period, Toggle Hyprland Visuals, exec, uwsm-app -- ~/user_scripts/hypr/hypr_blur_opacity_shadow_toggle.sh
bindld = $mainMod, period, Toggle Opacity, setprop, activewindow opaque toggle
bindld = $mainMod, comma, Toggle Blur, setprop, activewindow no_blur toggle
binded = SUPER, equal, Zoom In, exec, sh -c "hyprctl keyword cursor:zoom_factor \"$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {print $2 * 1.25}')\""
binded = SUPER, minus, Zoom Out, exec, sh -c "hyprctl keyword cursor:zoom_factor \"$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {val = $2 / 1.25; if (val < 1.0) val = 1.0; print val}')\""
bindld = SUPER, BACKSPACE, Reset Zoom, exec, hyprctl keyword cursor:zoom_factor 1.0
bindld = $mainMod ALT, X, Disable Shader, exec, hyprshade off
bindld = $mainMod ALT, V, Vibrant Shader, exec, hyprshade on vibrance
bindd = $mainMod, U, Key Press Sound, exec, uwsm-app -- ~/user_scripts/wayclick/dusky_wayclick.sh

##  Clipboard, screenshots, OCR  ##############################################

bindd = $mainMod, V, Clipboard History, exec, $cae launcher clipboard
bindd = $mainMod, B, Color Picker, exec, pkill hyprpicker || hyprpicker -a
bindd = $mainMod, S, Quick Screenshot, exec, ~/user_scripts/images/dusky_screenshot.sh --region --freeze --no-notify
bindld = SHIFT, Print, Full Screen Quick Screenshot, exec, grim - | wl-copy && notify-send "Fullscreen Screenshot in Clipboard"
bindd = $mainMod SHIFT, S, Screenshot and Annotation, exec, ~/user_scripts/images/dusky_screenshot.sh --region --freeze --annotate --no-notify --tool arrow
bindd = , Print, Fullscreen Screenshot and Annotation, exec, pgrep -x swappy || (grim - | uwsm-app -- satty -f -)
bindd = $mainMod, G, Image Search, exec, ~/user_scripts/google_image_search/google_image_search.sh
bindd = $mainMod, T, OCR Selection, exec, pgrep tesseract || (slurp | grim -g - - | tesseract stdin stdout -l eng | wl-copy)
bindd = $mainMod SHIFT, T, OCR Fullscreen, exec, grim - | tesseract stdin stdout -l eng | wl-copy

##  AI, TTS, media, Dota  #####################################################

bindd = $mainMod ALT, O, AI LLM Ollama Chat, exec, uwsm-app -- $terminal --class ollama_terminal.sh -e ~/user_scripts/llm/ollama_terminal.sh
bindd = $mainMod ALT, M, Music Recognition, exec, uwsm-app -- $terminal --hold --class music_recognition.sh -e ~/user_scripts/music/music_recognition.sh
bindd = $mainMod ALT, T, Toggle Dota Tempo Overlay, exec, /home/pc/dota-tempo/overlay/toggle-overlay.sh
bindd = $mainMod ALT, R, Toggle Dota Tempo Layout Mode, exec, /home/pc/dota-tempo/overlay/toggle-layout-mode.sh
bindd = $mainMod, O, TTS Kokoro GPU, exec, wl-copy "$(wl-paste -p)" && uwsm-app -- ~/user_scripts/tts_stt/dusky_kokoro/trigger.sh
bindd = $mainMod SHIFT, O, TTS VC, exec, uwsm-app -- ~/user_scripts/audio/router/TTS_VC.sh
bindd = $mainMod, I, STT Parakeet GPU, exec, uwsm-app -- ~/user_scripts/tts_stt/dusky_parakeet/trigger.sh
bindd = $mainMod SHIFT, M, Spotify Toggle, exec, uwsm-app -- ~/user_scripts/spotify/spotify_toggle.sh

##  Notifications  ############################################################

# Caelestia replaces swaync.
bindd = $mainMod, N, Toggle Notif Panel, exec, $cae drawers toggle dashboard
bindld = $mainMod ALT, D, Clear Notifications, exec, $cae notifs clear
bindld = $mainMod ALT, N, Toggle Do Not Disturb, exec, $cae notifs toggleDnd

##  Window management, verbatim from dusk  ####################################

bindd = $mainMod, C, Stash Window, exec, ~/user_scripts/hypr/window_stash.py stash
bindd = $mainMod SHIFT, C, Restore Stashed Window, exec, ~/user_scripts/hypr/window_stash.py pop
bindd = $mainMod CTRL, C, Terminate Focused Process, exec, ~/user_scripts/hypr/window_stash.py terminate
bindd = $mainMod, A, Window Fullscreen, fullscreen, 0
bindd = $mainMod SHIFT, A, Window Maximize, fullscreen, 1
bindd = $mainMod, X, Pin Window, pin
bindd = $mainMod, Y, Toggle Window Split, layoutmsg, togglesplit
bindd = $mainMod SHIFT, D, Toggle Pseudo, pseudo,
bindd = $mainMod, D, Toggle Float, exec, if hyprctl -j activewindow | jq -e '.floating | not'; then hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 90% 90%; dispatch centerwindow"; else hyprctl dispatch togglefloating; fi

binded = $mainMod, h, Focus Left, movefocus, l
binded = $mainMod, l, Focus Right, movefocus, r
binded = $mainMod, k, Focus Up, movefocus, u
binded = $mainMod, j, Focus Down, movefocus, d
binded = $mainMod SHIFT, h, Move Left, movewindow, l
binded = $mainMod SHIFT, l, Move Right, movewindow, r
binded = $mainMod SHIFT, k, Move Up, movewindow, u
binded = $mainMod SHIFT, j, Move Down, movewindow, d
binded = $mainMod, right, Resize Width +, resizeactive, 30 0
binded = $mainMod, left, Resize Width -, resizeactive, -30 0
binded = $mainMod, up, Resize Height -, resizeactive, 0 -30
binded = $mainMod, down, Resize Height +, resizeactive, 0 30

binddm = $mainMod, mouse:272, Move Window, movewindow
binddm = $mainMod, mouse:273, Resize Window, resizewindow

# Alt-Tab: escapes focus out of a mouse-locked tiled window (e.g. Dota) without
# clicking — a compositor-level bind, so it reaches Hyprland even when a game
# has the pointer confined/grabbed.
bindd = ALT, Tab, Cycle Next Window, cyclenext
bindd = ALT SHIFT, Tab, Cycle Previous Window, cyclenext, prev

##  Workspaces, verbatim from dusk  ###########################################

bindd = $mainMod, 1, Switch To Context 1, exec, $ws_script workspace 1
bindd = $mainMod, 2, Switch To Context 2, exec, $ws_script workspace 2
bindd = $mainMod, 3, Switch To Context 3, exec, $ws_script workspace 3
bindd = $mainMod, 4, Switch To Context 4, exec, $ws_script workspace 4
bindd = $mainMod, 5, Switch To Context 5, exec, $ws_script workspace 5
bindd = $mainMod, 6, Switch To Context 6, exec, $ws_script workspace 6
bindd = $mainMod, 7, Switch To Context 7, exec, $ws_script workspace 7
bindd = $mainMod, 8, Switch To Context 8, exec, $ws_script workspace 8
bindd = $mainMod, 9, Switch To Context 9, exec, $ws_script workspace 9
bindd = $mainMod, 0, Switch To Context 10, exec, $ws_script workspace 10

bindd = $mainMod SHIFT, 1, Move To Context 1, exec, $ws_script movetoworkspace 1
bindd = $mainMod SHIFT, 2, Move To Context 2, exec, $ws_script movetoworkspace 2
bindd = $mainMod SHIFT, 3, Move To Context 3, exec, $ws_script movetoworkspace 3
bindd = $mainMod SHIFT, 4, Move To Context 4, exec, $ws_script movetoworkspace 4
bindd = $mainMod SHIFT, 5, Move To Context 5, exec, $ws_script movetoworkspace 5
bindd = $mainMod SHIFT, 6, Move To Context 6, exec, $ws_script movetoworkspace 6
bindd = $mainMod SHIFT, 7, Move To Context 7, exec, $ws_script movetoworkspace 7
bindd = $mainMod SHIFT, 8, Move To Context 8, exec, $ws_script movetoworkspace 8
bindd = $mainMod SHIFT, 9, Move To Context 9, exec, $ws_script movetoworkspace 9
bindd = $mainMod SHIFT, 0, Move To Context 10, exec, $ws_script movetoworkspace 10

bindd = $mainMod ALT, 1, Silent Move To Context 1, exec, $ws_script movetoworkspacesilent 1
bindd = $mainMod ALT, 2, Silent Move To Context 2, exec, $ws_script movetoworkspacesilent 2
bindd = $mainMod ALT, 3, Silent Move To Context 3, exec, $ws_script movetoworkspacesilent 3
bindd = $mainMod ALT, 4, Silent Move To Context 4, exec, $ws_script movetoworkspacesilent 4
bindd = $mainMod ALT, 5, Silent Move To Context 5, exec, $ws_script movetoworkspacesilent 5
bindd = $mainMod ALT, 6, Silent Move To Context 6, exec, $ws_script movetoworkspacesilent 6
bindd = $mainMod ALT, 7, Silent Move To Context 7, exec, $ws_script movetoworkspacesilent 7
bindd = $mainMod ALT, 8, Silent Move To Context 8, exec, $ws_script movetoworkspacesilent 8
bindd = $mainMod ALT, 9, Silent Move To Context 9, exec, $ws_script movetoworkspacesilent 9
bindd = $mainMod ALT, 0, Silent Move To Context 10, exec, $ws_script movetoworkspacesilent 10

binded = $mainMod, TAB, Last Workspace, workspace, previous
binded = ALT SHIFT, TAB, Cycle Backward, workspace, e-1
binded = $mainMod SHIFT, TAB, Cycle Next WS, workspace, e+1
bindd = $mainMod, Z, Toggle Scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, Z, Move to Scratchpad, movetoworkspace, special:magic

##  Media and audio  ##########################################################

# Volume and mute keep dusk's scripts. Caelestia's OSD reads pipewire directly
# so it still displays the change.
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, ~/user_scripts/audio/active_output_volume.sh raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, ~/user_scripts/audio/active_output_volume.sh lower
bindeld = ,XF86AudioMute, Mute, exec, ~/user_scripts/audio/active_output_volume.sh mute-toggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, ~/user_scripts/audio/active_output_volume.sh +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, ~/user_scripts/audio/active_output_volume.sh -1
bindeld = ,XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness goes through caelestia so its own OSD shows.
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $cae brightness increaseBrightness
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $cae brightness decreaseBrightness
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl set +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl set 1%-

# Media keys go through caelestia's mpris service.
bindld = , XF86AudioNext, Next track, exec, $cae mpris next
bindld = , XF86AudioPause, Pause, exec, $cae mpris playPause
bindld = , XF86AudioPlay, Play, exec, $cae mpris playPause
bindld = , XF86AudioPrev, Previous track, exec, $cae mpris previous
bindld = $mainMod, P, Toggle Pause, exec, $cae mpris playPause

# Restored from dusk (keybinds.conf), remapped from raw playerctl to caelestia mpris.
bindld = CTRL, right, Next Track, exec, $cae mpris next
bindld = CTRL, left, Previous Track, exec, $cae mpris previous
bindld = CTRL, up, Play/Pause, exec, $cae mpris playPause

bindld = ALT, P, Mute Audio, exec, ~/user_scripts/audio/active_output_volume.sh mute-toggle
bindld = ALT, M, Mono Audio Toggle, exec, ~/user_scripts/audio/mono_audio_pipewire.py
bindld = ALT, O, Switch Audio Output, exec, uwsm-app -- ~/user_scripts/audio/audio_switch.sh
bindld = ALT, I, Switch Mic Input, exec, uwsm-app -- ~/user_scripts/audio/mic_switch.sh

##  Dropped from dusk, no caelestia equivalent  ###############################
#
#  These keys are intentionally free on this system:
#
#   ALT + 9            Start Waybar for 1 min      caelestia is the bar
#   ALT + 0            Kill Waybar                 caelestia is the bar
#   SUPER ALT + W      Waybar swap configs         caelestia is the bar
#   SUPER ALT SHIFT+W  Waybar swap configs back    caelestia is the bar
#   ALT + V            Dusky volume/brightness     org.dusky.sliders not on this system
#
#  SUPER + SPACE on dusk opened com.github.dusky.controlcenter. Here it opens
#  caelestia's dashboard instead, which is the nearest equivalent.

# Churn breaker: log each kill, and load the ignore list earlyoom-churn-eval writes.
[Service]
RuntimeDirectory=earlyoom-churn
RuntimeDirectoryPreserve=yes
EnvironmentFile=-/run/earlyoom-churn.env
ExecStart=
ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS $EARLYOOM_CHURN -N /usr/local/bin/earlyoom-churn-log

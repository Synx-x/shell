# Ctrl+V pastes text directly, but passes through to the app when the
# clipboard holds an image. A plain text paste broke image paste in
# Claude Code. Always sending Ctrl+V broke link paste in Codex.
map ctrl+v launch --type=background --allow-remote-control /home/pc/.local/bin/kitty-smart-paste

# Draw Nerd Font icons from kitty's bundled Symbols Nerd Font Mono. The name
# selects the built-in copy, so icons stay sharp and one cell wide instead of
# coming from a proportional fallback font.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
